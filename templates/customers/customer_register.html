<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | WorkBridge</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/global_ui.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 32px 16px;
        }

        .auth-container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl);
            padding: 40px 36px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo {
            font-family: var(--font-heading);
            font-size: 26px;
            font-weight: 800;
            color: var(--slate-900);
            display: inline-block;
            margin-bottom: 8px;
            text-decoration: none;
        }

        .auth-logo span {
            color: var(--primary);
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 800;
            color: var(--slate-900);
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--slate-500);
        }

        .error-banner {
            background: var(--danger-light);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .success-banner {
            background: var(--success-light);
            color: var(--success-text);
            border: 1px solid var(--success-border);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .is-invalid {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18) !important;
        }

        @media (max-width: 640px) {
            .auth-container {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <a href="{% url 'home' %}" class="auth-logo">WorkBridge<span>.</span></a>
            <h1 class="auth-title">Customer Registration</h1>
            <p class="auth-subtitle">Create an employer account to post tasks and hire talented students.</p>
        </div>

        <!-- Flash Messages -->
        {% include "components/alerts.html" %}

        <form method="POST" id="customerRegistrationForm" novalidate>
            {% csrf_token %}

            <div class="success-banner" id="successMessage" {% if success %}style="display:block;"{% endif %}>
                🎉 Registered successfully! You can now <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 700; text-decoration: underline;">Login to your account</a>.
            </div>

            <div class="error-banner" id="formError" {% if error %}style="display:block;"{% endif %}>
                {{ error }}
            </div>

            <!-- FULL NAME -->
            <div class="form-group">
                <label class="form-label" for="name">Full Name / Organization Name <span style="color: var(--danger);">*</span></label>
                <input id="name" type="text" name="name" class="form-input" placeholder="e.g. John Doe / Apex Studios" required>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label class="form-label" for="email">Email Address <span style="color: var(--danger);">*</span></label>
                <input id="email" type="email" name="email" class="form-input" placeholder="e.g. john@example.com" required>
            </div>

            <!-- MOBILE -->
            <div class="form-group">
                <label class="form-label" for="mobile">Mobile Number <span style="color: var(--danger);">*</span></label>
                <input id="mobile" type="tel" name="mobile" class="form-input" placeholder="e.g. 9876543210" required>
            </div>

            <!-- ADDRESS -->
            <div class="form-group">
                <label class="form-label" for="address">Address / Location Details <span style="color: var(--danger);">*</span></label>
                <textarea id="address" name="address" rows="3" class="form-textarea" placeholder="Enter your full street address, city, and district" required></textarea>
            </div>

            <!-- 2-COL PASSWORDS -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label" for="password">Password <span style="color: var(--danger);">*</span></label>
                    <input id="password" type="password" name="password" class="form-input" placeholder="Min. 8 characters" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password <span style="color: var(--danger);">*</span></label>
                    <input id="confirm_password" type="password" name="confirm_password" class="form-input" placeholder="Re-type password" required>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;">Create Customer Account</button>
                <button type="reset" class="btn btn-secondary btn-lg">Reset</button>
            </div>

        </form>

        <p style="text-align: center; margin-top: 24px; color: var(--slate-500); font-size: 14px;">
            Already have an account?
            <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Login here</a>
        </p>
    </div>

    <script src="{% static 'js/global_ui.js' %}"></script>
    <script>
        const form = document.getElementById('customerRegistrationForm');
        const formError = document.getElementById('formError');
        const fields = ['name', 'email', 'mobile', 'address', 'password', 'confirm_password'];

        function clearValidation() {
            if (formError) {
                formError.style.display = 'none';
                formError.textContent = '';
            }
            fields.forEach(id => {
                const field = document.getElementById(id);
                if (field) {
                    field.classList.remove('is-invalid');
                }
            });
        }

        function showValidationError(message, invalidFields = []) {
            if (formError) {
                formError.textContent = message;
                formError.style.display = 'block';
            }
            invalidFields.forEach(id => {
                const field = document.getElementById(id);
                if (field) {
                    field.classList.add('is-invalid');
                }
            });
        }

        if (form) {
            form.addEventListener('submit', function (event) {
                clearValidation();

                const values = {
                    name: document.getElementById('name').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    mobile: document.getElementById('mobile').value.trim(),
                    address: document.getElementById('address').value.trim(),
                    password: document.getElementById('password').value,
                    confirm_password: document.getElementById('confirm_password').value,
                };

                const missingFields = fields.filter(id => !values[id]);

                if (missingFields.length > 0) {
                    event.preventDefault();
                    showValidationError('Please complete all required fields.', missingFields);
                    return;
                }

                if (values.password !== values.confirm_password) {
                    event.preventDefault();
                    showValidationError('Passwords do not match.', ['password', 'confirm_password']);
                    return;
                }

                if (values.password.length < 8) {
                    event.preventDefault();
                    showValidationError('Password must be at least 8 characters long.', ['password', 'confirm_password']);
                    return;
                }
            });
        }
    </script>

</body>
</html>
