{% if messages %}
<div class="alert-message-container" id="djangoAlertContainer">
    {% for message in messages %}
        <div class="alert-item alert-{{ message.tags|default:'info' }}" role="alert">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 16px;">
                    {% if message.tags == 'success' %}✅
                    {% elif message.tags == 'error' or message.tags == 'danger' %}❌
                    {% elif message.tags == 'warning' %}⚠️
                    {% else %}ℹ️{% endif %}
                </span>
                <span>{{ message }}</span>
            </div>
            <button type="button" class="alert-close" aria-label="Dismiss alert">&times;</button>
        </div>
    {% endfor %}
</div>
{% endif %}
